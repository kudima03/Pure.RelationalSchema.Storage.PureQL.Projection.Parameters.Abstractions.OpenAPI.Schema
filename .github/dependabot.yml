version: 2
updates:
- package-ecosystem: nuget
  directories:
    - "src/Pure.RelationalSchema.Storage.PureQL.Projection.Parameters.Abstractions.OpenAPI.Schema"
    - "src/Tests/Pure.RelationalSchema.Storage.PureQL.Projection.Parameters.Abstractions.OpenAPI.Schema.Tests"
  schedule:
    interval: daily
  ignore:
    # Microsoft.AspNetCore.OpenApi 10 requires Microsoft.OpenApi < 3.0.0
    - dependency-name: "Microsoft.OpenApi"
      update-types: ["version-update:semver-major"]
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: "devcontainers"
  directory: "/"
  schedule:
    interval: weekly
